<div class="p-8 font-mono text-xs space-y-4 bg-muted/30 rounded-2xl border">
  <div class="grid grid-cols-2 gap-4 border-b pb-2 opacity-50 uppercase tracking-widest">
    <span>Token</span>
    <span>Value</span>
  </div>
  
  <div class="space-y-2">
    <div class="font-bold opacity-70 mt-4">Fonts</div>
    <div class="grid grid-cols-2 gap-4">
      <span>$p-font-sans</span>
      <span>'Inter', sans-serif</span>
    </div>
    <div class="grid grid-cols-2 gap-4">
      <span>$p-font-heading</span>
      <span>'Space Grotesk', sans-serif</span>
    </div>
  </div>

  <div class="space-y-2">
    <div class="font-bold opacity-70 mt-4">Colors</div>
    <div class="grid grid-cols-2 gap-4">
      <span>$p-white</span>
      <span>#ffffff</span>
    </div>
    <div class="grid grid-cols-2 gap-4">
      <span>$p-black</span>
      <span>#000000</span>
    </div>
    <div class="grid grid-cols-2 gap-4">
      <span>$p-bg-light</span>
      <span>#fafafa</span>
    </div>
    <div class="grid grid-cols-2 gap-4">
      <span>$p-bg-dark</span>
      <span>#0a0a0a</span>
    </div>
  </div>

  <div class="space-y-2">
    <div class="font-bold opacity-70 mt-4">Radius</div>
    <div class="grid grid-cols-2 gap-4">
      <span>$p-radius-3xl</span>
      <span>1.5rem</span>
    </div>
    <div class="grid grid-cols-2 gap-4">
      <span>$p-radius-feature</span>
      <span>2rem</span>
    </div>
  </div>

  <div class="space-y-2">
    <div class="font-bold opacity-70 mt-4">Motion</div>
    <div class="grid grid-cols-2 gap-4">
      <span>$p-ease-smooth</span>
      <span>cubic-bezier(0.4, 0, 0.2, 1)</span>
    </div>
  </div>
</div>
