<section class="micro-free-layout" style="display:grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; align-items: start; grid-template-areas: "top top" "left right" "bottom bottom";">
  <div style="grid-area: top;">
    <div class="micro-slot" data-slot="top"></div>
  </div>
  <div style="grid-area: left;">
    <div class="micro-slot" data-slot="left"></div>
  </div>
  <div style="grid-area: right;">
    <div class="micro-slot" data-slot="right"></div>
  </div>
  <div style="grid-area: bottom;">
    <div class="micro-slot" data-slot="bottom"></div>
  </div>
</section>
